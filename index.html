<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 個人用のページなので検索エンジンには載せない -->
<meta name="robots" content="noindex">
<title>PEREGRAPH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;600&display=swap">
<style>
/* レイアウト: 見出し → 業績・★注目・持ち株の切り替えと、その右に業績の市場（日本株・米国株）と好決算・改善の切り替え（狭い画面では下の段に回る）
   → 線の凡例 → チャートのカード（スマホは1列、広い画面は3列まで） */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --line: #d8deea;
  --fg: #15213a;
  --muted: #5b6880;
  --accent: #2160d0;
  --on-accent: #ffffff;
  --up: #d93f45;      /* 陽線（証券会社アプリと同じく赤） */
  --down: #2a6fdb;    /* 陰線（青） */
  --ma13: #b88700;
  --ma26: #e0662f;
  --ma52: #1f8a8a;
  --star: #d99a00;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1324;
    --surface: #131c31;
    --line: #26324c;
    --fg: #e6ebf5;
    --muted: #8f9bb2;
    --accent: #6b9fff;
    --on-accent: #0c1324;
    --up: #f0656a;
    --down: #5b9bff;
    --ma13: #e6c34a;
    --ma26: #f08a5d;
    --ma52: #5cc1c1;
    --star: #f2c14e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1324;
  --surface: #131c31;
  --line: #26324c;
  --fg: #e6ebf5;
  --muted: #8f9bb2;
  --accent: #6b9fff;
  --on-accent: #0c1324;
  --up: #f0656a;
  --down: #5b9bff;
  --ma13: #e6c34a;
  --ma26: #f08a5d;
  --ma52: #5cc1c1;
  --star: #f2c14e;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
.wrap {
  max-width: 1320px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}
h1 { font-size: 1.375rem; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.8125rem; line-height: 1.5; }
.pflinks { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 4px; font-size: 0.8125rem; }
.pflinks a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 上の部分（見出し・切り替え・凡例・件数・銘柄を足す欄）は、スクロールしても画面の上に残す。動くのはカードだけ。
   スマホでは残す部分が画面をふさぐので、切り替えの段だけ残す */
.pinned {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin: -20px -16px 0;
  padding: 20px 16px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
@media (max-width: 640px), (max-height: 620px) {
  .pinned { display: contents; }
  .tabs { position: sticky; top: 0; z-index: 10; margin: -6px -16px; padding: 6px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
}
.tabs { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.market {
  display: inline-flex;
  align-self: flex-start;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
}
.market button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.875rem;
  padding: 6px 14px;
  border-radius: 999px;
  white-space: nowrap;
}
.market button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.75rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.legend .k13 { border-color: var(--ma13); }
.legend .k26 { border-color: var(--ma26); }
.legend .k52 { border-color: var(--ma52); }
.listhead { margin: 0; font-size: 0.8125rem; color: var(--muted); }
.listhead strong { color: var(--fg); font-size: 0.9375rem; margin-right: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: 12px; }
/* カードは銘柄ページへのリンクと、その左上に重ねた☆ボタン（リンクの中にボタンは置けないので重ねる） */
.card {
  position: relative;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.card:hover { border-color: var(--accent); }
.card > a {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px 12px 8px;
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
}
.card > a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card .top { padding-left: 24px; }
.star {
  appearance: none;
  position: absolute;
  top: 5px;
  left: 4px;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 1.125rem;
  line-height: 1;
}
.star[aria-pressed="true"] { color: var(--star); }
.card .gone { margin: 8px 0 4px; color: var(--muted); font-size: 0.75rem; }
.empty { margin: 8px 0; color: var(--muted); font-size: 0.875rem; }
.card .top, .card .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .name { min-width: 0; font-size: 0.875rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .vs { flex: none; font-family: var(--font-num); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.card .meta { font-family: var(--font-num); font-size: 0.6875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .meta .id { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta .off { flex: none; }
.card .sector { margin-left: 8px; font-family: var(--font-body); }
.card .price { margin-left: 8px; color: var(--fg); }
.card svg { display: block; width: 100%; height: auto; margin-top: 6px; }
/* 持ち株と注目: 抜けの札、銘柄を足す欄 */
.badge { flex: none; font-size: 0.75rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge.cu { border-color: var(--up); color: var(--up); }
.badge.cd { border-color: var(--down); color: var(--down); }
/* 業績タブに入って NEW_DAYS 日以内の銘柄の「新」 */
.badge.nw { padding: 0 6px; border-color: var(--up); background: var(--up); color: #fff; }
.card .alerts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.card .alerts:empty { display: none; }
.holdadd { display: flex; flex-wrap: wrap; gap: 8px; }
.holdadd input {
  font: inherit; color: inherit; flex: 1 1 220px; min-width: 0; max-width: 420px;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
}
.holdadd input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.market button { padding-inline: clamp(8px, 2.6vw, 14px); }
.up line, .up rect { stroke: var(--up); fill: var(--up); }
.down line, .down rect { stroke: var(--down); fill: var(--down); }
.up line, .down line { stroke-width: 1; }
.up rect, .down rect { stroke-width: 0; }
.ma13, .ma26, .ma52 { fill: none; stroke-width: 1.4; stroke-linejoin: round; }
.ma13 { stroke: var(--ma13); }
.ma26 { stroke: var(--ma26); stroke-width: 1.8; }
.ma52 { stroke: var(--ma52); }
#more {
  appearance: none;
  align-self: center;
  padding: 8px 22px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 0.875rem;
}
.transfer { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.transfer button {
  appearance: none;
  padding: 6px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 0.8125rem;
}
.transfer p { margin: 0; color: var(--muted); font-size: 0.75rem; line-height: 1.6; overflow-wrap: anywhere; }
.card .nm { min-width: 0; display: flex; align-items: baseline; gap: 6px; }
.card .since { margin-top: 2px; font-family: var(--font-num); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .since b { font-weight: 500; }
.card .since .gain { color: var(--up); }
.card .since .loss { color: var(--down); }
.stack { display: flex; flex-direction: column; gap: 10px; }
/* 業績タブ: 決算の見出し */
.card .note { margin-top: 4px; font-size: 0.75rem; line-height: 1.5; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .note .when { margin-right: 6px; font-family: var(--font-num); color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <div class="pinned">
  <header>
    <h1>PEREGRAPH</h1>
    <p class="sub" id="sub">決算の良かった銘柄</p>
    <nav class="pflinks"><a href="portfolio.html">ポートフォリオ</a><a href="quiz.html">チャート当てクイズ</a><a href="shape.html">次のモデルナ探し</a></nav>
  </header>

  <div class="tabs">
  <div class="market" role="tablist" aria-label="市場">
    <button type="button" role="tab" id="tab-rank" data-market="rank" aria-selected="true">売買代金</button>
    <button type="button" role="tab" id="tab-earn" data-market="earn" aria-selected="false">業績</button>
    <button type="button" role="tab" id="tab-fav" data-market="fav" aria-selected="false">★ 注目</button>
    <button type="button" role="tab" id="tab-hold" data-market="hold" aria-selected="false">持ち株</button>
  </div>

  <div class="market" id="earnmarkets" role="tablist" aria-label="業績の市場" hidden>
    <button type="button" role="tab" data-earn-market="jp" aria-selected="true">日本株</button>
    <button type="button" role="tab" data-earn-market="us" aria-selected="false">米国株</button>
  </div>
  <div class="market" id="shapes" role="tablist" aria-label="業績" hidden>
    <button type="button" role="tab" data-shape="good" aria-selected="true">好決算</button>
    <button type="button" role="tab" data-shape="improve" aria-selected="false">改善</button>
  </div>
  </div>

  <div class="legend" id="legend" aria-label="チャートの見方"></div>

  <div class="stack" id="hold" hidden>
    <form class="transfer" id="holdform">
      <div class="holdadd">
        <input id="holdcode" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" aria-label="持っている銘柄のコード" placeholder="この端末に足す（例: 7203 AAPL）">
        <button type="submit">足す</button>
      </div>
      <p id="holdnotice" aria-live="polite"></p>
    </form>
    <p class="listhead" id="holdhead"></p>
  </div>

  <p class="listhead" id="listhead"></p>
  <div class="transfer" id="transfer" hidden>
    <p>☆はこの端末だけに残ります。ほかの端末とそろえるときは「写す」を押し、出た文字をもう一方の端末の欄に貼って「合流」を押してください。</p>
    <button type="button" id="copysync">この端末の☆と持ち株を写す</button>
    <form class="holdadd" id="syncform">
      <input id="synccode" type="text" autocomplete="off" aria-label="ほかの端末で写した文字" placeholder="ほかの端末で写した文字を貼る（PG1:…）">
      <button type="submit">合流</button>
    </form>
    <p id="notice" aria-live="polite"></p>
  </div>
  </div>

  <div class="grid" id="holdgrid" hidden></div>
  <div class="grid" id="grid"></div>
  <button type="button" id="more" hidden>もっと見る</button>

</main>

let notice = "", holdNotice = "";
// 持ち株と注目のチャートは、銘柄ごとのファイル（s/市場/コード.json）から読む。全銘柄ぶんをページに持たせると重いため。
// stockFiles の値は、読めたらその中身、読み込み中は "loading"、無い・読めないときは null
const stockFiles = new Map();
let renderQueued = false;
function loadStock(market, code) {
  const key = `${market}|${code}`;
  if (!stockFiles.has(key)) {
    stockFiles.set(key, "loading");
    fetch(`s/${market}/${encodeURIComponent(code)}.json`)
      .then((res) => (res.ok ? res.json() : null))
      .catch(() => null)
      .then((data) => {
        stockFiles.set(key, data);
        // 何銘柄かまとめて届いても、描き直しは1回にする
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => { renderQueued = false; render(); });
      });
  }
  return stockFiles.get(key);
}
// コード（空白や読点で区切って複数可）を足す。全角は半角に、小文字は大文字にそろえ、日本株 → 米国株の順に探す
function addHolds(text) {
  const codes = text.normalize("NFKC").toUpperCase().split(/[\s,、]+/).filter(Boolean);
  const added = [], dup = [], missing = [];
  for (const code of codes) {
    const market = ["jp", "us"].find((m) => priceOf(m, code) != null);
    if (!market) missing.push(code);
    else if (hasHold(market, code) || added.some((a) => a.code === code)) dup.push(code);
    else added.push({ market, code });
  }
  for (const a of added) setListed("hold", a.market, a.code, true, a);
  holdNotice = [
    added.length ? `${added.map((a) => a.code).join("・")} を足しました。` : "",
    dup.length ? `${dup.join("・")} はもう入っています。` : "",
    missing.length ? `${missing.join("・")} は見つかりませんでした（コードの打ち間違いか、対象外の銘柄です）。` : "",
  ].filter(Boolean).join(" ");
  return !missing.length;
}
// 持ち株と注目のカードのチャート（ローソク足と移動平均）。s は銘柄ごとのファイルの、1つの足の種類ぶん。
// 始値・高値・安値は終値からのずれ（千分率）で入っている。移動平均は、チャートより前の終値（p）も使ってここで計算する
function stockChart(s, sizes) {
  const n = s.c.length;
  const o = s.c.map((c, i) => (c == null || s.o[i] == null ? null : c * (1 + s.o[i] / 1000)));
  const h = s.c.map((c, i) => (o[i] == null || s.h[i] == null ? null : Math.max(o[i], c) * (1 + s.h[i] / 1000)));
  const l = s.c.map((c, i) => (o[i] == null || s.l[i] == null ? null : Math.min(o[i], c) * (1 - s.l[i] / 1000)));
  const all = (s.p || []).concat(s.c), before = all.length - n;
  const average = (size) => s.c.map((_, i) => {
    const part = all.slice(Math.max(0, before + i - size + 1), before + i + 1);
    return part.length < size || part.some((v) => v == null) ? null : part.reduce((a, b) => a + b, 0) / size;
  });
  const [maS, maM, maL] = sizes.map(average);
  return chart({ o, h, l, c: s.c, maS, maM, maL });
}
// 持ち株のカードは、抜けたばかりの銘柄を先に並べる（その中では足した順）
function renderHold() {
  const holds = allHolds();
  const rows = holds.map((h) => ({ h, crossed: freshCrosses(h.market, h.code).length > 0 }))
    .sort((a, b) => b.crossed - a.crossed);
  const crossed = rows.filter((r) => r.crossed).length;
  document.getElementById("holdhead").innerHTML = holds.length
    ? `<strong>${holds.length}銘柄</strong>${crossed ? `平均線の抜け ${crossed}` : "抜けたばかりの銘柄はありません"}`
    : "";
  document.getElementById("holdgrid").innerHTML = holds.length
    ? rows.map((r) => ownCard(r.h.market, r.h.code, { drop: true })).join("")
    : `<p class="empty">持っている銘柄のコードを入れて「足す」を押すと、ここに並びます。</p>`;
  document.getElementById("holdnotice").textContent = holdNotice;
}

function toggleFav(market, code) {
  const on = !favOf(market, code);
  setListed("fav", market, code, on, { market, code, price: priceOf(market, code), from: today(), added: today() });
  notice = `${code} を注目${on ? "に入れました" : "から外しました"}。`;
  render();
}

function chart(s) {
  const W = 320, H = 180, P = 6, n = s.c.length;
  const values = [...s.h, ...s.l, ...s.c, ...s.maS, ...s.maM, ...s.maL].filter((v) => v != null);
  const max = Math.max(...values), min = Math.min(...values);
  const span = max - min || 1;
  const step = W / n, body = Math.max(1, step * 0.62);
  const x = (i) => (i + 0.5) * step;
  const y = (v) => P + ((max - v) / span) * (H - 2 * P);
  const f = (v) => v.toFixed(1);

  const line = (arr, cls) => {
    const pts = arr.map((v, i) => (v == null ? null : `${f(x(i))},${f(y(v))}`)).filter(Boolean).join(" ");
    return `<polyline class="${cls}" points="${pts}"></polyline>`;
  };
  const candles = s.c.map((c, i) => {
    const o = s.o[i], h = s.h[i], l = s.l[i];
    if ([o, h, l, c].some((v) => v == null)) return "";
    const top = y(Math.max(o, c)), bottom = y(Math.min(o, c));
    return `<g class="${c >= o ? "up" : "down"}">
      <line x1="${f(x(i))}" x2="${f(x(i))}" y1="${f(y(h))}" y2="${f(y(l))}"></line>
      <rect x="${f(x(i) - body / 2)}" y="${f(top)}" width="${f(body)}" height="${f(Math.max(0.8, bottom - top))}"></rect>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ローソク足チャート">
    ${line(s.maL, "ma52")}${line(s.maM, "ma26")}${line(s.maS, "ma13")}${candles}
  </svg>`;
}

// カード。s は銘柄（body にチャートか、チャートが無い理由）。
// opts.own が true なら（持ち株・注目）抜けの札を出す。opts.since なら☆を付けてからの値動きを出す。
// opts.drop なら、☆の代わりに持ち株から外す × を付ける
function card(market, s, opts = {}) {
  const fav = favOf(market, s.code);
  let since = "";
  const now = priceOf(market, s.code);
  if (opts.since && fav && fav.price && now) {
    const change = (now / fav.price - 1) * 100;
    since = `<div class="since">${esc(fav.from || fav.added)} に☆を付けてから <b class="${change >= 0.05 ? "gain" : change <= -0.05 ? "loss" : ""}">${pct(change)}</b></div>`;
  }
  const button = opts.drop
    ? `<button type="button" class="star drop" data-hold-market="${market}" data-code="${esc(s.code)}" aria-label="持ち株から外す">×</button>`
    : `<button type="button" class="star" data-fav-market="${market}" data-code="${esc(s.code)}" aria-pressed="${Boolean(fav)}" aria-label="${fav ? "注目から外す" : "注目に入れる"}">${fav ? "★" : "☆"}</button>`;
  return `<div class="card">
    <a href="${esc(detailUrl(market, s.code))}" target="_blank" rel="noopener">
      <div class="top"><span class="nm">${opts.note && isNew(opts.note.since) ? `<span class="badge nw">新</span>` : ""}<span class="name" title="${esc(s.name)}">${esc(s.name)}</span></span></div>
      <div class="meta"><span class="id">${esc(s.code)}${now != null ? `<span class="price">${money(market, now)}</span>` : ""}${s.sector ? `<span class="sector">${esc(s.sector)}</span>` : ""}</span></div>
      ${since}
      ${opts.note ? `<div class="note"><span class="when">${esc(opts.note.date)}</span>${esc(opts.note.title)}</div>${opts.note.move != null ? `<div class="since">決算の発表から <b class="${opts.note.move > 0 ? "gain" : opts.note.move < 0 ? "loss" : ""}">${pct(opts.note.move)}</b>${opts.note.excess != null ? `（相場より ${pct(opts.note.excess)}）` : ""}${opts.note.since ? `・${shortDate(opts.note.since)}から` : ""}</div>` : ""}` : ""}
      ${opts.rank ? `<div class="since">${opts.rank.n}位・売買代金 <b>${turnoverText(market, opts.rank.turnover)}</b>${opts.rank.change != null ? `・前日比 <b class="${opts.rank.change > 0 ? "gain" : opts.rank.change < 0 ? "loss" : ""}">${pct(opts.rank.change)}</b>` : ""}</div>` : ""}
      ${opts.own && !opts.note && !opts.rank ? `<div class="alerts">${crossBadges(market, s.code)}</div>` : ""}
      ${s.body ?? chart(s)}
    </a>
    ${button}
  </div>`;
}
// 持ち株・注目のカード。チャートは銘柄ごとのファイルから、いま選んでいる足のものを出す。
// known は、ファイルが読めなくても分かっている名前と業種（注目は☆を付けたときのものを持っている）
function ownCard(market, code, opts = {}, known = {}) {
  const file = loadStock(market, code);
  const loaded = file && file !== "loading";
  const bars = loaded ? file[state.frame] : null;
  const body = file === "loading" ? `<p class="gone">読み込み中…</p>`
    : bars ? stockChart(bars, FRAMES[state.frame].sizes)
      : `<p class="gone">この銘柄の${loaded ? FRAMES[state.frame].name + "は、まだありません。" : "株価は、いま取れていません。"}</p>`;
  const s = { code, name: (loaded && file.name) || known.name || code, sector: (loaded && file.sector) || known.sector || "", body };
  return card(market, s, { ...opts, own: true });
}

function render() {
  document.querySelectorAll("[data-market]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.market === state.market)));
  const favs = allFavs(), holds = allHolds();
  document.getElementById("tab-fav").textContent = favs.length ? `★ 注目 ${favs.length}` : "★ 注目";
  document.getElementById("tab-hold").textContent = holds.length ? `持ち株 ${holds.length}` : "持ち株";
  const sub = document.getElementById("sub");
  const head = document.getElementById("listhead");
  const grid = document.getElementById("grid");
  const isFavTab = state.market === "fav";
  const isHold = state.market === "hold";
  const isEarn = state.market === "earn";
  const isRank = state.market === "rank";
  document.getElementById("shapes").hidden = !isEarn;
  document.getElementById("earnmarkets").hidden = !isEarn && !isRank;  // 日本株・米国株の切り替えは、業績と売買代金で使う
  document.getElementById("hold").hidden = !isHold;
  document.getElementById("holdgrid").hidden = !isHold;
  grid.hidden = isHold;
  document.getElementById("transfer").hidden = !isFavTab;
  document.getElementById("notice").textContent = notice;
  const lines = FRAMES[state.frame].ma;
  document.getElementById("legend").innerHTML =
    `<span><i class="k13"></i>${lines[0]}</span><span><i class="k26"></i>${lines[1]}</span><span><i class="k52"></i>${lines[2]}</span>`;

  if (isHold) {
    sub.textContent = "持っている銘柄";
    head.innerHTML = "";
    grid.innerHTML = "";
    document.getElementById("more").hidden = true;
    renderHold();
    return;
  }

  if (isRank) {
    // 売買代金タブ。DATA[市場].rank は、取引が終わった直近の1日の売買代金の大きい順（上位50）
    const m = state.earnMarket, rank = DATA[m].rank || {}, all = rank.stocks || [];
    document.querySelectorAll("[data-earn-market]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.earnMarket === m)));
    const list = all.slice(0, state.shown);
    sub.textContent = `${rank.date || ""}の売買代金の多い${m === "us" ? "米国株" : "日本株"}（上位${all.length}）`;
    head.innerHTML = all.length ? `<strong>${all.length}銘柄</strong>売買代金の大きい順に${list.length}銘柄を表示` : "";
    grid.innerHTML = list.length
      ? list.map((s, i) => ownCard(m, s.code, { rank: { ...s, n: i + 1 } }, s)).join("")
      : `<p class="empty">売買代金のデータを、いま読めていません。</p>`;
    document.getElementById("more").hidden = state.shown >= all.length;
    return;
  }

  if (isEarn) {
    const m = state.earnMarket, isImprove = state.shape === "improve", isUs = m === "us";
    document.querySelectorAll("[data-earn-market]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.earnMarket === m)));
    document.querySelectorAll("[data-shape]").forEach((b) => {
      b.textContent = `${SHAPES[b.dataset.shape]} ${earnList(m, b.dataset.shape).length}`;
      b.setAttribute("aria-selected", String(b.dataset.shape === state.shape));
    });
    const all = earnList(m, state.shape);
    const list = all.slice(0, state.shown);
    const earn = DATA[m].earn || {}, days = earn.days || 45;
    // 売買代金の下限（ページを作る側の MIN_TURNOVER）。日本株は「5億円」、米国株は「2000万ドル」のように出す
    const limit = earn.min_turnover
      ? `（1日の売買代金${isUs ? `${earn.min_turnover / 1e4}万ドル` : `${earn.min_turnover / 1e8}億円`}以上）`
      : "";
    sub.textContent = (isUs
      ? (isImprove ? `直近${days}日の決算で、赤字だが1株利益が予想を大きく上回り、発表から株価が5%以上、かつ相場全体より5%以上上がった米国株`
        : `直近${days}日の決算で1株利益が予想を大きく上回り、発表から株価が5%以上、かつ相場全体より5%以上上がった米国株`)
      : (isImprove ? `株探の決算速報（直近${days}日）で、赤字縮小・黒字浮上・増益・上方修正・増配など良くなった決算（好決算を除く）のあと、株価が5%以上、かつ相場全体より5%以上上がった日本株`
        : `株探の決算速報（直近${days}日）で業績が強く、発表から株価が5%以上、かつ相場全体より5%以上上がった日本株`)) + limit;
    const order = "売買代金の大きい順";
    head.innerHTML = all.length ? `<strong>${all.length.toLocaleString()}銘柄</strong>${order}に${list.length}銘柄を表示` : "";
    grid.innerHTML = list.length
      ? list.map((s) => ownCard(m, s.code, { note: s }, s)).join("")
      : `<p class="empty">${isImprove ? "決算が良くなって株価も上がっている銘柄は、いまありません。" : "業績が良くて株価も上がっている銘柄は、いまありません。"}</p>`;
    document.getElementById("more").hidden = state.shown >= all.length;
    return;
  }

  if (isFavTab) {
    sub.textContent = "☆を付けた注目の銘柄（新しく付けた順）";
    const crossed = favs.filter((f) => freshCrosses(f.market, f.code).length).length;
    head.innerHTML = favs.length ? `<strong>${favs.length}銘柄</strong>注目中${crossed ? `・平均線の抜け ${crossed}` : ""}` : "";
    grid.innerHTML = favs.length
      ? favs.map((f) => ownCard(f.market, f.code, { since: true }, f)).join("")
      : `<p class="empty">カードの☆を押すと、ここに残せます。</p>`;
    document.getElementById("more").hidden = true;
  }
}

document.querySelector("main").addEventListener("click", (e) => {
  const b = e.target.closest(".star:not(.drop)");
  if (b) toggleFav(b.dataset.favMarket, b.dataset.code);
  const drop = e.target.closest(".drop");
  if (drop) {
    setListed("hold", drop.dataset.holdMarket, drop.dataset.code, false);
    holdNotice = `${drop.dataset.code} を外しました。`;
    render();
  }
});
// 端末どうしで☆と持ち株をそろえる。この端末で足した分を「PG1:」で始まる文字にして写し、もう一方の端末に貼って合流する。
// 合流は足すだけで、消すことはしない（両方の端末の☆と持ち株を合わせたものになる）
const SYNC_PREFIX = "PG1:";
const syncCode = () => SYNC_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify({ fav: favs, hold: holds }))));
function mergeSync(text) {
  const raw = text.trim();
  if (!raw.startsWith(SYNC_PREFIX)) return [false, "写した文字ではないようです（PG1: で始まる文字を貼ってください）。"];
  let data;
  try { data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(SYNC_PREFIX.length))))); } catch { return [false, "文字が途中で切れているようです。もう一度写して貼ってください。"]; }
  let addedFav = 0, addedHold = 0;
  for (const f of (data.fav || []).slice().reverse()) {  // 新しく付けた順を保つため、古い方から足す
    if (f && f.market && f.code && !favOf(f.market, f.code)) { setListed("fav", f.market, f.code, true, f); addedFav++; }
  }
  for (const h of data.hold || []) {
    if (h && h.market && h.code && !hasHold(h.market, h.code)) { setListed("hold", h.market, h.code, true, { market: h.market, code: h.code }); addedHold++; }
  }
  return [true, addedFav || addedHold
    ? `☆を${addedFav}銘柄、持ち株を${addedHold}銘柄足しました。`
    : "足す銘柄はありませんでした（もう全部そろっています）。"];
}
document.getElementById("copysync").addEventListener("click", () => {
  const code = syncCode();
  const input = document.getElementById("synccode");
  const done = () => { notice = "写しました。もう一方の端末で、この下の欄に貼って「合流」を押してください。"; render(); };
  const fallback = () => { input.value = code; input.select(); notice = "下の欄の文字を全部選んでコピーし、もう一方の端末に貼ってください。"; render(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, fallback);
  else fallback();
});
document.getElementById("syncform").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("synccode");
  if (!input.value.trim()) return;
  const [ok, message] = mergeSync(input.value);
  notice = message;
  if (ok) input.value = "";
  render();
});
document.getElementById("holdform").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("holdcode");
  if (!input.value.trim()) return;
  if (addHolds(input.value)) input.value = "";
  render();
});
document.querySelector(".market").addEventListener("click", (e) => {
  const b = e.target.closest("[data-market]");
  if (!b) return;
  state.market = b.dataset.market;
  state.shown = STEP;
  render();
});
document.getElementById("earnmarkets").addEventListener("click", (e) => {
  const b = e.target.closest("[data-earn-market]");
  if (!b) return;
  state.earnMarket = b.dataset.earnMarket;
  state.shown = STEP;
  render();
});
document.getElementById("shapes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-shape]");
  if (!b) return;
  state.shape = b.dataset.shape;
  state.shown = STEP;
  render();
});
document.getElementById("more").addEventListener("click", () => {
  state.shown += STEP;
  render();
});
render();
</script>
</body>
</html>
