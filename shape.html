const LABEL = {jp: "日本株", us: "米国株"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pct = v => (v > 0 ? "+" : "") + Math.round(v * 100) + "%";
let market = "us";

// 今の形（太い線）と、手本の上がる前の形（点線）を重ねる。どちらも値段の高さ・振れ幅をそろえてある
function overlay(a, b) {
  const W = 300, H = 110, P = 8;
  const all = [...a, ...b], lo = Math.min(...all), hi = Math.max(...all);
  const x = i => P + (W - 2 * P) * i / (a.length - 1);
  const y = v => P + (H - 2 * P) * (1 - (v - lo) / (hi - lo || 1));
  const path = s => s.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="形のくらべ">
    <path d="${path(b)}" fill="none" stroke="var(--model)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${path(a)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg>`;
}

function link(m, code) {
  return m === "jp" ? `https://kabutan.jp/stock/chart?code=${code}` : `https://us.kabutan.jp/stocks/${code}/chart`;
}

function render() {
  document.querySelectorAll("[data-market]").forEach(b => b.setAttribute("aria-selected", b.dataset.market === market));
  const d = DATA.markets[market];
  document.getElementById("sub").textContent =
    `過去に1年で${DATA.surge}倍以上になった銘柄の「上がる前の${DATA.shape}か月の形」に、今の形がそっくりな銘柄（${DATA.built} 時点）`;
  const c = d.check;
  document.getElementById("how").textContent =
    `${LABEL[market]}の手本は ${d.models} 個。過去の${c.months}か月で、毎月その時点までに分かった手本だけを使って似ている上位20銘柄を選んだとすると、その後1年で:`;
  document.getElementById("facts").innerHTML = [
    ["2倍以上になった割合", c.double, c.double_all],
    ["半分以下になった割合", c.half, c.half_all],
    ["上がり方の真ん中", c.median, c.median_all],
  ].map(([label, v, all]) => `<div class="fact"><span>${label}</span><b>${label.includes("真ん中") ? pct(v) : (v * 100).toFixed(1) + "%"}</b>
    <span>全体は ${label.includes("真ん中") ? pct(all) : (all * 100).toFixed(1) + "%"}</span></div>`).join("");
  const odds = c.double / c.double_all;
  document.getElementById("verdict").textContent = odds >= 1.5
    ? `大当たり（2倍以上）は全体の約${odds.toFixed(1)}倍出やすい一方、大はずれ（半分以下）も出やすい。当たりもはずれも大きい「くじ」です。`
    : `全体と大きな差はありません。形だけで当てるのは難しい市場です。遊びとしてどうぞ。`;
  document.getElementById("picks").innerHTML = d.picks.map(p => `
    <article class="card pick">
      <h3><span><a href="${link(market, p.code)}" target="_blank" rel="noopener">${esc(p.code)}</a> ${esc(p.name)}</span>
        <span class="num">似ている度 ${Math.round(p.sim * 100)}%</span></h3>
      <p class="meta">株価 <span class="num">${market === "us" ? "$" : ""}${p.price.toLocaleString()}</span>・この1年 <span class="num ${p.rise >= 0 ? "pos" : "neg"}">${pct(p.rise)}</span></p>
      ${overlay(p.shape, p.model.shape)}
      <div class="legend"><span><i style="border-color:var(--accent)"></i>今（${p.from}〜${p.to}）</span>
        <span><i style="border-color:var(--model);border-top-style:dashed"></i>手本（${p.model.from}〜${p.model.start}）</span></div>
      <p class="model">手本: <a href="${link(market, p.model.code)}" target="_blank" rel="noopener">${esc(p.model.code)}</a> ${esc(p.model.name)} は、この形のあと1年で <b class="num pos">${p.model.times}倍</b></p>
    </article>`).join("");
}

document.querySelectorAll("[data-market]").forEach(b => b.addEventListener("click", () => { market = b.dataset.market; render(); }));
