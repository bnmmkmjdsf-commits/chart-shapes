<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 個人用のページなので検索エンジンには載せない -->
<meta name="robots" content="noindex">
<title>PEREGRAPH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;600&display=swap">
<style>
/* レイアウト: 見出し → 市場（日本株・米国株・★注目・持ち株）の切り替えと、その右に足（日足・週足・月足）の切り替え（狭い画面では下の段に回る）
   → 線の凡例 → チャートのカード（スマホは1列、広い画面は3列まで） */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --line: #d8deea;
  --fg: #15213a;
  --muted: #5b6880;
  --accent: #2160d0;
  --on-accent: #ffffff;
  --band: rgba(33, 96, 208, 0.12);
  --up: #d93f45;      /* 陽線（証券会社アプリと同じく赤） */
  --down: #2a6fdb;    /* 陰線（青） */
  --ma13: #b88700;
  --ma26: #e0662f;
  --ma52: #1f8a8a;
  --star: #d99a00;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1324;
    --surface: #131c31;
    --line: #26324c;
    --fg: #e6ebf5;
    --muted: #8f9bb2;
    --accent: #6b9fff;
    --on-accent: #0c1324;
    --band: rgba(107, 159, 255, 0.16);
    --up: #f0656a;
    --down: #5b9bff;
    --ma13: #e6c34a;
    --ma26: #f08a5d;
    --ma52: #5cc1c1;
    --star: #f2c14e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1324;
  --surface: #131c31;
  --line: #26324c;
  --fg: #e6ebf5;
  --muted: #8f9bb2;
  --accent: #6b9fff;
  --on-accent: #0c1324;
  --band: rgba(107, 159, 255, 0.16);
  --up: #f0656a;
  --down: #5b9bff;
  --ma13: #e6c34a;
  --ma26: #f08a5d;
  --ma52: #5cc1c1;
  --star: #f2c14e;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
.wrap {
  max-width: 1320px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}
h1 { font-size: 1.375rem; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.8125rem; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.market {
  display: inline-flex;
  align-self: flex-start;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
}
.market button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.875rem;
  padding: 6px 14px;
  border-radius: 999px;
  white-space: nowrap;
}
.market button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.75rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.legend .k13 { border-color: var(--ma13); }
.legend .k26 { border-color: var(--ma26); }
.legend .k52 { border-color: var(--ma52); }
.legend .kband { width: 10px; height: 12px; border: 0; background: var(--band); }
.legend .klow { border-color: var(--fg); }
.listhead { margin: 0; font-size: 0.8125rem; color: var(--muted); }
.listhead strong { color: var(--fg); font-size: 0.9375rem; margin-right: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: 12px; }
/* カードは銘柄ページへのリンクと、その左上に重ねた☆ボタン（リンクの中にボタンは置けないので重ねる） */
.card {
  position: relative;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.card:hover { border-color: var(--accent); }
.card > a {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px 12px 8px;
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
}
.card > a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card .top { padding-left: 24px; }
.star {
  appearance: none;
  position: absolute;
  top: 5px;
  left: 4px;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 1.125rem;
  line-height: 1;
}
.star[aria-pressed="true"] { color: var(--star); }
.card .gone { margin: 8px 0 4px; color: var(--muted); font-size: 0.75rem; }
.empty { margin: 8px 0; color: var(--muted); font-size: 0.875rem; }
.card .top, .card .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .name { min-width: 0; font-size: 0.875rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .vs { flex: none; font-family: var(--font-num); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.card .meta { font-family: var(--font-num); font-size: 0.6875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .meta .id { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta .off { flex: none; }
.card .sector { margin-left: 8px; font-family: var(--font-body); }
.card .price { margin-left: 8px; color: var(--fg); }
.card svg { display: block; width: 100%; height: auto; margin-top: 6px; }
.band { fill: var(--band); stroke: none; }
/* 持ち株: 山と谷の印（短い横線）と、節目の株価の点線 */
.lowmark { stroke: var(--fg); stroke-width: 2; stroke-linecap: round; }
.lowline { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 3 3; }
/* 持ち株: 終値の折れ線、状態の札、銘柄を足す欄 */
.closeline { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linejoin: round; }
.badge { flex: none; font-size: 0.75rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge.broke { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.badge.caution { background: var(--star); border-color: var(--star); color: #15213a; }
.badge.turned, .badge.basing { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.card .next { margin-top: 4px; font-size: 0.8125rem; line-height: 1.6; }
.card .next b { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.holdadd { display: flex; flex-wrap: wrap; gap: 8px; }
.holdadd input {
  font: inherit; color: inherit; flex: 1 1 220px; min-width: 0; max-width: 420px;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
}
.holdadd input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.market button { padding-inline: clamp(8px, 2.6vw, 14px); }
.up line, .up rect { stroke: var(--up); fill: var(--up); }
.down line, .down rect { stroke: var(--down); fill: var(--down); }
.up line, .down line { stroke-width: 1; }
.up rect, .down rect { stroke-width: 0; }
.ma13, .ma26, .ma52 { fill: none; stroke-width: 1.4; stroke-linejoin: round; }
.ma13 { stroke: var(--ma13); }
.ma26 { stroke: var(--ma26); stroke-width: 1.8; }
.ma52 { stroke: var(--ma52); }
#more {
  appearance: none;
  align-self: center;
  padding: 8px 22px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 0.875rem;
}
.transfer { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.transfer button {
  appearance: none;
  padding: 6px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 0.8125rem;
}
.transfer p { margin: 0; color: var(--muted); font-size: 0.75rem; line-height: 1.6; overflow-wrap: anywhere; }
#topsec { display: flex; flex-direction: column; gap: 10px; }
.sechead { margin: 6px 0 0; font-size: 1rem; font-weight: 600; }
.sechead span { margin-left: 8px; color: var(--muted); font-size: 0.75rem; font-weight: 400; }
.card .nm { min-width: 0; display: flex; align-items: baseline; gap: 6px; }
.card .rank { flex: none; font-family: var(--font-num); font-size: 0.8125rem; color: var(--accent); }
.card .since { margin-top: 2px; font-family: var(--font-num); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .since b { font-weight: 500; }
.card .since .gain { color: var(--up); }
.card .since .loss { color: var(--down); }
.stack { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>PEREGRAPH</h1>
    <p class="sub" id="sub">長い下ひげを付けて、出来高が増えた銘柄</p>
  </header>

  <div class="tabs">
  <div class="market" role="tablist" aria-label="市場">
    <button type="button" role="tab" id="tab-jp" data-market="jp" aria-selected="true">日本株</button>
    <button type="button" role="tab" id="tab-us" data-market="us" aria-selected="false">米国株</button>
    <button type="button" role="tab" id="tab-fav" data-market="fav" aria-selected="false">★ 注目</button>
    <button type="button" role="tab" id="tab-hold" data-market="hold" aria-selected="false">持ち株</button>
  </div>

  <div class="market" id="frames" role="tablist" aria-label="足の種類">
    <button type="button" role="tab" data-frame="d" aria-selected="false">日足</button>
    <button type="button" role="tab" data-frame="w" aria-selected="true">週足</button>
    <button type="button" role="tab" data-frame="m" aria-selected="false">月足</button>
  </div>
  </div>

  <div class="legend" id="legend" aria-label="チャートの見方"></div>

  <section class="stack" id="hold" hidden>
    <form class="transfer" id="holdform">
      <div class="holdadd">
        <input id="holdcode" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" aria-label="持っている銘柄のコード" placeholder="銘柄コード（例: 7203 AAPL）">
        <button type="submit">足す</button>
        <button type="button" id="sendhold">ほかの端末に送る</button>
      </div>
      <p id="holdnotice" aria-live="polite"></p>
    </form>
    <p class="listhead" id="holdhead"></p>
    <div class="grid" id="holdgrid"></div>
  </section>

  <section id="topsec">
    <h2 class="sechead">TOP 5<span id="topnote">下ひげの長さ × 出来高の増え方</span></h2>
    <div class="grid" id="topgrid"></div>
  </section>

  <h2 class="sechead" id="listtitle">下ひげ × 出来高増</h2>
  <p class="listhead" id="listhead"></p>
  <div class="transfer" id="transfer" hidden>
    <button type="button" id="send">ほかの端末に送る</button>
    <p id="notice" aria-live="polite"></p>
  </div>
  <div class="grid" id="grid"></div>
  <button type="button" id="more" hidden>もっと見る</button>

</main>

<script>
const DATA = __DATA__;
const STEP = 20;
const state = { market: "jp", frame: "w", shown: STEP };
// 足の種類。ma はチャートに描く移動平均（短期・中期・長期）で、ページを作る側（gallery.py の FRAMES）と同じ本数
const FRAMES = {
  d: { name: "日足", ma: ["5日線", "25日線", "75日線"], after: "日後" },
  w: { name: "週足", ma: ["13週線", "26週線", "52週線"], after: "週後" },
  m: { name: "月足", ma: ["12か月線", "24か月線", "60か月線"], after: "か月後" },
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// 株価の表示。日本株は「1,234円」、米国株は「$12.34」
const money = (market, v) => market === "jp"
  ? `${v.toLocaleString("ja-JP", { maximumFractionDigits: 1 })}円`
  : `$${v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
const pct = (v) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(1) + "%";
// 銘柄の詳細は株探へ。米国株のクラス株は株探では BRK-B ではなく BRK.B の形
const detailUrl = (market, code) => market === "jp"
  ? `https://kabutan.jp/stock/?code=${encodeURIComponent(code)}`
  : `https://us.kabutan.jp/stocks/${encodeURIComponent(code.replace(/-/g, "."))}`;

// 注目（☆を付けた銘柄。以前は「保留」と呼んでいた）。この端末のブラウザに保存する。保存できない環境でもページは動くようにする。
// ☆を付けた日の株価（price）と日付（from）も持ち、注目タブで今の株価との差を出す
const FAV_KEY = "favorites-v1";
const today = () => { const d = new Date(); return `${d.getMonth() + 1}/${d.getDate()}`; };
const priceOf = (market, code) => (DATA[market].prices || {})[code] ?? null;
// 条件に合っている銘柄を探す。いま選んでいる足を先に、無ければほかの足から探し、見つけた足の種類（frame）を付けて返す
function findStock(market, code) {
  for (const frame of [state.frame, "w", "d", "m"]) {
    const s = DATA[market].frames[frame].stocks.find((x) => x.code === code);
    if (s) return { ...s, frame };
  }
  return null;
}
let favs = (() => {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; }
})();
const saveFavs = () => { try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch {} };
// 株価を持たない古い注目は、今日の株価を起点にする
if (favs.some((f) => f.price == null && priceOf(f.market, f.code) != null)) {
  favs.forEach((f) => {
    if (f.price == null && priceOf(f.market, f.code) != null) Object.assign(f, { price: priceOf(f.market, f.code), from: today() });
  });
  saveFavs();
}
// ほかの端末への引き継ぎ。注目の中身をリンクの # の後ろに入れる（# の後ろはサーバーに送られない）。
// 開いた端末では、まだ持っていない銘柄だけを足す（外した銘柄は引き継がない）
const TRANSFER = "#fav=";
const encodeFavs = (list) => btoa(unescape(encodeURIComponent(JSON.stringify(list))));
const decodeFavs = (text) => JSON.parse(decodeURIComponent(escape(atob(text))));
let notice = "";
if (location.hash.startsWith(TRANSFER)) {
  try {
    const incoming = decodeFavs(location.hash.slice(TRANSFER.length))
      .filter((f) => f && (f.market === "jp" || f.market === "us") && f.code);
    const added = incoming.filter((f) => !favs.some((x) => x.market === f.market && x.code === f.code));
    favs = [...added, ...favs];
    saveFavs();
    notice = `ほかの端末から${added.length}銘柄を取り込みました（すでにあった${incoming.length - added.length}銘柄はそのまま）。`;
  } catch {
    notice = "リンクが途中で切れているようで、取り込めませんでした。";
  }
  history.replaceState(null, "", location.pathname + location.search);
  state.market = "fav";
}
async function sendFavs() {
  const url = location.origin + location.pathname + TRANSFER + encodeFavs(favs);
  const el = document.getElementById("notice");
  try {
    if (navigator.share) {
      await navigator.share({ title: "注目の引き継ぎ", url });
      return;
    }
    await navigator.clipboard.writeText(url);
    el.textContent = "リンクをコピーしました。もう一方の端末で開くと、注目が取り込まれます。";
  } catch (e) {
    if (e && e.name === "AbortError") return;  // 共有画面を閉じただけ
    el.textContent = `このリンクをもう一方の端末で開いてください: ${url}`;
  }
}
// 持ち株。ページで登録した銘柄（市場とコードだけ）を、この端末のブラウザに保存する。
// 状態と週足の終値は、ページが全銘柄ぶん持っている（DATA[市場].hold）
const HOLD_KEY = "holdings-v1";
const HOLD_TRANSFER = "#hold=";
const holdData = (market) => DATA[market].hold || { bar: "", signal: 0, stocks: {} };
let holds = (() => {
  try { return JSON.parse(localStorage.getItem(HOLD_KEY)) || []; } catch { return []; }
})();
const saveHolds = () => { try { localStorage.setItem(HOLD_KEY, JSON.stringify(holds)); } catch {} };
let holdNotice = "";
const hasHold = (market, code) => holds.some((h) => h.market === market && h.code === code);
if (location.hash.startsWith(HOLD_TRANSFER)) {
  try {
    const incoming = decodeFavs(location.hash.slice(HOLD_TRANSFER.length))
      .filter((h) => h && (h.market === "jp" || h.market === "us") && h.code);
    const added = incoming.filter((h) => !hasHold(h.market, h.code));
    holds = [...holds, ...added.map((h) => ({ market: h.market, code: String(h.code) }))];
    saveHolds();
    holdNotice = `ほかの端末から${added.length}銘柄を取り込みました。`;
  } catch {
    holdNotice = "リンクが途中で切れているようで、取り込めませんでした。";
  }
  history.replaceState(null, "", location.pathname + location.search);
}
// 持ち株があれば、初めに持ち株タブを開く
if (holds.length && state.market === "jp") state.market = "hold";
// コード（空白や読点で区切って複数可）を足す。全角は半角に、小文字は大文字にそろえ、日本株 → 米国株の順に探す
function addHolds(text) {
  const codes = text.normalize("NFKC").toUpperCase().split(/[\s,、]+/).filter(Boolean);
  const added = [], dup = [], missing = [];
  for (const code of codes) {
    const market = ["jp", "us"].find((m) => holdData(m).stocks[code]);
    if (!market) missing.push(code);
    else if (hasHold(market, code)) dup.push(code);
    else { holds.push({ market, code }); added.push(code); }
  }
  saveHolds();
  holdNotice = [
    added.length ? `${added.join("・")} を足しました。` : "",
    dup.length ? `${dup.join("・")} はもう入っています。` : "",
    missing.length ? `${missing.join("・")} は見つかりませんでした（コードの打ち間違いか、対象外の銘柄です）。` : "",
  ].filter(Boolean).join(" ");
  return !missing.length;
}
async function sendHolds() {
  const url = location.origin + location.pathname + HOLD_TRANSFER + encodeFavs(holds);
  try {
    if (navigator.share) {
      await navigator.share({ title: "持ち株の引き継ぎ", url });
      return;
    }
    await navigator.clipboard.writeText(url);
    holdNotice = "リンクをコピーしました。もう一方の端末で開くと、持ち株が取り込まれます。";
  } catch (e) {
    if (e && e.name === "AbortError") return;  // 共有画面を閉じただけ
    holdNotice = `このリンクをもう一方の端末で開いてください: ${url}`;
  }
  render();
}
// 状態の札。rank は並び順（気にした方がいいものを先に）
const FRESH_BARS = 4;
function holdStatus(s) {
  if (s && s.range) return { key: "range", label: "横ばい", rank: 4 };
  if (!s || !s.trend) return { key: "none", label: "判定なし", rank: 7 };
  const fresh = s.flipped && s.ago <= FRESH_BARS;
  if (s.trend === "down") {
    return s.warn ? { key: "basing", label: "下げ止まり", rank: 3 }
      : fresh ? { key: "broke", label: "崩れ", rank: 0 } : { key: "down", label: "下落中", rank: 5 };
  }
  return s.warn ? { key: "caution", label: "注意", rank: 1 }
    : fresh ? { key: "turned", label: "反転", rank: 2 } : { key: "up", label: "上昇中", rank: 6 };
}
// 状態の説明と、次に向きが切り替わる株価
function holdNext(market, s, status) {
  if (status.key === "none") return "山と谷がまだ無く、向きが決まりません。";
  if (status.key === "range") {
    const [bottom, top] = s.range;
    const price = s.c.filter((v) => v != null).pop();
    return `この半年、<b>${money(market, bottom)}</b>〜<b>${money(market, top)}</b> の間で動いています。`
      + ` 週の終値が上限を超える（いまから ${pct((top / price - 1) * 100)}）か、下限を割る（${pct((bottom / price - 1) * 100)}）と、動き出しの合図`;
  }
  const ago = s.ago === 0 ? "直近の週に" : `${s.ago}週前に`;
  const lead = {
    broke: `${ago}前の底値を割りました。`,
    down: s.flipped ? `${ago}前の底値を割ってから下げが続いています。` : "下げが続いています。",
    basing: "底値が前の底値より高くなりました。",
    caution: "高値が前の高値に届かずに下げています。",
    turned: `${ago}前の高値を超えました。`,
    up: "底値を切り上げています。",
  }[status.key];
  if (s.level == null) return lead;
  const now = s.c.filter((v) => v != null).pop();
  const gap = pct((s.level / now - 1) * 100);
  return lead + (s.trend === "up"
    ? ` 週の終値が <b>${money(market, s.level)}</b> を割ると崩れ（いまから ${gap}）`
    : ` 週の終値が <b>${money(market, s.level)}</b> を超えると反転（いまから ${gap}）`);
}
// 終値の折れ線。山の上・谷の下に短い横線、次に向きが切り替わる株価に点線
function lineChart(s, signal) {
  const W = 320, H = 180, P = 14, n = s.c.length;
  // 点線は、横ばいなら上限と下限、そうでなければ次に向きが切り替わる株価
  const levels = s.range || (s.level == null ? [] : [s.level]);
  const values = s.c.filter((v) => v != null).concat(levels);
  const max = Math.max(...values), min = Math.min(...values);
  const span = max - min || 1;
  const step = W / n;
  const x = (i) => (i + 0.5) * step;
  const y = (v) => P + ((max - v) / span) * (H - 2 * P);
  const f = (v) => v.toFixed(1);
  const pts = s.c.map((v, i) => (v == null ? null : `${f(x(i))},${f(y(v))}`)).filter(Boolean).join(" ");
  const marks = s.pivots.map(([i, v, high]) => {
    const at = y(v) + (high ? -7 : 7);
    return `<line class="lowmark" x1="${f(x(i) - 7)}" x2="${f(x(i) + 7)}" y1="${f(at)}" y2="${f(at)}"></line>`;
  }).join("");
  const level = levels.map((v) => `<line class="lowline" x1="0" x2="${W}" y1="${f(y(v))}" y2="${f(y(v))}"></line>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="週足の終値の折れ線">
    <rect class="band" x="${f(signal * step)}" y="0" width="${f(step)}" height="${H}"></rect>
    ${level}<polyline class="closeline" points="${pts}"></polyline>${marks}
  </svg>`;
}
function holdCard(h) {
  const data = holdData(h.market), s = data.stocks[h.code];
  const status = holdStatus(s);
  const now = priceOf(h.market, h.code);
  return `<div class="card">
    <a href="${esc(detailUrl(h.market, h.code))}" target="_blank" rel="noopener">
      <div class="top"><span class="nm"><span class="name" title="${esc(s ? s.name : h.code)}">${esc(s ? s.name : h.code)}</span></span>${s ? `<span class="badge ${status.key}">${status.label}</span>` : ""}</div>
      <div class="meta"><span class="id">${esc(h.code)}${now != null ? `<span class="price">${money(h.market, now)}</span>` : ""}${s && s.sector ? `<span class="sector">${esc(s.sector)}</span>` : ""}</span></div>
      ${s ? `<div class="next">${holdNext(h.market, s, status)}</div>${lineChart(s, data.signal)}` : `<p class="gone">この銘柄の株価は、いま取れていません。</p>`}
    </a>
    <button type="button" class="star drop" data-hold-market="${h.market}" data-code="${esc(h.code)}" aria-label="持ち株から外す">×</button>
  </div>`;
}
function renderHold() {
  const rows = holds.map((h) => ({ h, status: holdStatus(holdData(h.market).stocks[h.code]) }))
    .sort((a, b) => a.status.rank - b.status.rank);
  const counts = {};
  rows.forEach((r) => { counts[r.status.label] = (counts[r.status.label] || 0) + 1; });
  document.getElementById("holdhead").innerHTML = holds.length
    ? `<strong>${holds.length}銘柄</strong>${Object.entries(counts).map(([label, n]) => `${label} ${n}`).join("・")}`
    : "";
  document.getElementById("holdgrid").innerHTML = holds.length
    ? rows.map((r) => holdCard(r.h)).join("")
    : `<p class="empty">持っている銘柄のコードを入れて「足す」を押すと、ここに並びます。</p>`;
  document.getElementById("sendhold").hidden = !holds.length;
  document.getElementById("holdnotice").textContent = holdNotice;
}

const favOf = (market, code) => favs.find((f) => f.market === market && f.code === code);
function toggleFav(market, code) {
  if (favOf(market, code)) {
    favs = favs.filter((f) => !(f.market === market && f.code === code));
  } else {
    const s = findStock(market, code);
    favs.unshift({ market, code, name: s.name, sector: s.sector || "", added: today(), from: today(), price: priceOf(market, code) });
  }
  saveFavs();
  render();
}

function chart(s) {
  const W = 320, H = 180, P = 6, n = s.c.length;
  const values = [...s.h, ...s.l, ...s.maS, ...s.maM, ...s.maL].filter((v) => v != null);
  const max = Math.max(...values), min = Math.min(...values);
  const span = max - min || 1;
  const step = W / n, body = Math.max(1, step * 0.62);
  const x = (i) => (i + 0.5) * step;
  const y = (v) => P + ((max - v) / span) * (H - 2 * P);
  const f = (v) => v.toFixed(1);

  const band = `<rect class="band" x="${f(s.signal * step)}" y="0" width="${f(step)}" height="${H}"></rect>`;
  const line = (arr, cls) => {
    const pts = arr.map((v, i) => (v == null ? null : `${f(x(i))},${f(y(v))}`)).filter(Boolean).join(" ");
    return `<polyline class="${cls}" points="${pts}"></polyline>`;
  };
  const candles = s.c.map((c, i) => {
    const o = s.o[i], h = s.h[i], l = s.l[i];
    if ([o, h, l, c].some((v) => v == null)) return "";
    const top = y(Math.max(o, c)), bottom = y(Math.min(o, c));
    return `<g class="${c >= o ? "up" : "down"}">
      <line x1="${f(x(i))}" x2="${f(x(i))}" y1="${f(y(h))}" y2="${f(y(l))}"></line>
      <rect x="${f(x(i) - body / 2)}" y="${f(top)}" width="${f(body)}" height="${f(Math.max(0.8, bottom - top))}"></rect>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ローソク足チャート">
    ${band}${line(s.maL, "ma52")}${line(s.maM, "ma26")}${line(s.maS, "ma13")}${candles}
  </svg>`;
}

// カード。s は条件に合った銘柄（チャートあり）か、注目だけに残った銘柄（チャート無し）。
// opts.rank はTOPの順位、opts.since が true なら☆を付けてからの値動きを出す
function card(market, s, opts = {}) {
  const fav = favOf(market, s.code);
  const live = Boolean(s.c);
  const right = live ? `下ひげ ${s.wick}%` : "";
  // 注目タブでは、どの足で条件に合っているかも出す
  const metaRight = live ? `${s.frame ? FRAMES[s.frame].name + " " : ""}出来高 ${s.volumeRatio}倍` : market === "jp" ? "日本株" : "米国株";
  let since = "";
  const now = priceOf(market, s.code);
  if (opts.since && fav && fav.price && now) {
    const change = (now / fav.price - 1) * 100;
    since = `<div class="since">${esc(fav.from || fav.added)} に☆を付けてから <b class="${change >= 0.05 ? "gain" : change <= -0.05 ? "loss" : ""}">${pct(change)}</b></div>`;
  }
  return `<div class="card">
    <a href="${esc(detailUrl(market, s.code))}" target="_blank" rel="noopener">
      <div class="top"><span class="nm">${opts.rank ? `<span class="rank">${opts.rank}</span>` : ""}<span class="name" title="${esc(s.name)}">${esc(s.name)}</span></span>${right ? `<span class="vs">${right}</span>` : ""}</div>
      <div class="meta"><span class="id">${esc(s.code)}${now != null ? `<span class="price">${money(market, now)}</span>` : ""}${s.sector ? `<span class="sector">${esc(s.sector)}</span>` : ""}</span><span class="off">${metaRight}</span></div>
      ${since}
      ${live ? chart(s) : `<p class="gone">今は条件から外れています</p>`}
    </a>
    <button type="button" class="star" data-fav-market="${market}" data-code="${esc(s.code)}" aria-pressed="${Boolean(fav)}" aria-label="${fav ? "注目から外す" : "注目に入れる"}">${fav ? "★" : "☆"}</button>
  </div>`;
}

function render() {
  document.querySelectorAll("[data-market]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.market === state.market)));
  document.getElementById("tab-fav").textContent = favs.length ? `★ 注目 ${favs.length}` : "★ 注目";
  document.getElementById("tab-hold").textContent = holds.length ? `持ち株 ${holds.length}` : "持ち株";
  const sub = document.getElementById("sub");
  const head = document.getElementById("listhead");
  const grid = document.getElementById("grid");
  const isFavTab = state.market === "fav";
  const isHold = state.market === "hold";
  document.getElementById("hold").hidden = !isHold;
  document.getElementById("topsec").hidden = isFavTab || isHold;
  document.getElementById("listtitle").hidden = isFavTab || isHold;
  document.getElementById("transfer").hidden = !isFavTab;
  document.getElementById("send").hidden = !favs.length;
  document.getElementById("notice").textContent = notice;
  document.getElementById("frames").hidden = isFavTab || isHold;
  document.querySelectorAll("[data-frame]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.frame === state.frame)));
  const lines = isFavTab ? ["短期線", "中期線", "長期線"] : FRAMES[state.frame].ma;
  document.getElementById("legend").innerHTML = isHold
    ? `<span><i class="klow"></i>山と谷</span><span><i class="klow" style="border-top-style:dashed;border-top-width:1px"></i>節目の株価</span>`
      + `<span><i class="kband"></i>状態を決めた週</span>`
    : `<span><i class="k13"></i>${lines[0]}</span><span><i class="k26"></i>${lines[1]}</span><span><i class="k52"></i>${lines[2]}</span>`
      + `<span><i class="kband"></i>${isFavTab ? "条件に合った足" : "下ひげを付けた足"}</span>`;

  if (isHold) {
    const bars = [...new Set(holds.map((h) => holdData(h.market).bar).filter(Boolean))];
    sub.textContent = "持っている銘柄の、いまの状態" + (bars.length ? `（${bars.join("・")}の週足まで）` : "（週足）");
    head.innerHTML = "";
    grid.innerHTML = "";
    document.getElementById("more").hidden = true;
    renderHold();
    return;
  }

  if (isFavTab) {
    sub.textContent = "☆を付けた注目の銘柄（新しく付けた順）";
    head.innerHTML = favs.length ? `<strong>${favs.length}銘柄</strong>注目中` : "";
    grid.innerHTML = favs.length
      ? favs.map((f) => card(f.market, findStock(f.market, f.code) || f, { since: true })).join("")
      : `<p class="empty">カードの☆を押すと、ここに残せます。</p>`;
    document.getElementById("more").hidden = true;
    return;
  }

  const market = DATA[state.market].frames[state.frame];
  const list = market.stocks.slice(0, state.shown);
  const top = market.top;
  sub.textContent = `長い下ひげを付けて、出来高が増えた銘柄（${market.bar}の${FRAMES[state.frame].name}）`;
  document.getElementById("topgrid").innerHTML = top.length
    ? top.map((s, i) => card(state.market, s, { rank: i + 1 })).join("")
    : `<p class="empty">条件に合う銘柄がありません。</p>`;
  head.innerHTML = `<strong>${market.count.toLocaleString()}銘柄</strong>時価総額の大きい順に${list.length}銘柄を表示`;
  grid.innerHTML = list.map((s) => card(state.market, s)).join("");
  document.getElementById("more").hidden = state.shown >= market.stocks.length;
}

document.getElementById("send").addEventListener("click", sendFavs);
document.querySelector("main").addEventListener("click", (e) => {
  const b = e.target.closest(".star:not(.drop)");
  if (b) toggleFav(b.dataset.favMarket, b.dataset.code);
  const drop = e.target.closest(".drop");
  if (drop) {
    holds = holds.filter((h) => !(h.market === drop.dataset.holdMarket && h.code === drop.dataset.code));
    saveHolds();
    holdNotice = `${drop.dataset.code} を外しました。`;
    render();
    return;
  }
});
document.getElementById("holdform").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("holdcode");
  if (!input.value.trim()) return;
  if (addHolds(input.value)) input.value = "";
  render();
});
document.getElementById("sendhold").addEventListener("click", sendHolds);
document.querySelector(".market").addEventListener("click", (e) => {
  const b = e.target.closest("[data-market]");
  if (!b) return;
  state.market = b.dataset.market;
  state.shown = STEP;
  render();
});
document.getElementById("frames").addEventListener("click", (e) => {
  const b = e.target.closest("[data-frame]");
  if (!b) return;
  state.frame = b.dataset.frame;
  state.shown = STEP;
  render();
});
document.getElementById("more").addEventListener("click", () => {
  state.shown += STEP;
  render();
});
render();
</script>
</body>
</html>
