<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 個人用のページなので検索エンジンには載せない -->
<meta name="robots" content="noindex">
<title>日米チャート形状</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;600&display=swap">
<style>
/* レイアウト: 見出し → 市場の切り替え → 4つの形のタイル（2×2）→ 1ヶ月チャートのカード（狭い画面は2列、広い画面は列を増やす） */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --line: #d8deea;
  --fg: #15213a;
  --muted: #5b6880;
  --accent: #2160d0;
  --accent-soft: rgba(33, 96, 208, 0.10);
  --on-accent: #ffffff;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1324;
    --surface: #131c31;
    --line: #26324c;
    --fg: #e6ebf5;
    --muted: #8f9bb2;
    --accent: #6b9fff;
    --accent-soft: rgba(107, 159, 255, 0.14);
    --on-accent: #0c1324;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1324;
  --surface: #131c31;
  --line: #26324c;
  --fg: #e6ebf5;
  --muted: #8f9bb2;
  --accent: #6b9fff;
  --accent-soft: rgba(107, 159, 255, 0.14);
  --on-accent: #0c1324;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
h1 { font-size: 1.375rem; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.8125rem; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.market {
  display: inline-flex;
  align-self: flex-start;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
}
.market button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.875rem;
  padding: 6px 18px;
  border-radius: 999px;
}
.market button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.shapes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 720px) { .shapes { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.shape {
  appearance: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  text-align: left;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.shape .meta { display: flex; align-items: center; gap: 10px; }
.shape svg { flex: none; width: 40px; height: 24px; color: var(--muted); }
.shape path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.shape .name { font-weight: 600; font-size: 0.9375rem; white-space: nowrap; }
.shape .count { font-family: var(--font-num); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.shape[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.shape[aria-pressed="true"] svg { color: var(--accent); }
.listhead { margin: 4px 0 0; font-size: 0.8125rem; color: var(--muted); }
.listhead strong { color: var(--fg); font-size: 0.9375rem; margin-right: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 10px 6px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.card .name {
  min-width: 0;
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card .chg { flex: none; font-family: var(--font-num); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.card .code { font-family: var(--font-num); font-size: 0.6875rem; color: var(--muted); }
.card svg { display: block; width: 100%; height: auto; margin-top: 4px; }
.base { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
.area { fill: var(--accent-soft); stroke: none; }
.line { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.dot { fill: var(--accent); stroke: none; }
#more {
  appearance: none;
  align-self: center;
  padding: 8px 22px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 0.875rem;
}
.note { display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.75rem; line-height: 1.6; }
.note p { margin: 0; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>チャートの形で探す</h1>
    <p class="sub" id="asof">直近1ヶ月の値動き</p>
  </header>

  <div class="market" role="tablist" aria-label="市場">
    <button type="button" role="tab" id="tab-jp" data-market="jp" aria-selected="true">日本株</button>
    <button type="button" role="tab" id="tab-us" data-market="us" aria-selected="false">米国株</button>
  </div>

  <div class="shapes" id="shapes"></div>

  <p class="listhead" id="listhead"></p>
  <div class="grid" id="grid"></div>
  <button type="button" id="more" hidden>もっと見る</button>

  <footer class="note">
    <p>点線は1ヶ月前の株価の高さ、右端の点が直近の終値です。株価は Yahoo Finance の日足（分割・配当調整済み）。</p>
    <p>日本株は東証の全銘柄、米国株は時価総額3億ドル以上の銘柄が対象で、形ごとに時価総額の大きい順に最大60銘柄を載せています。</p>
    <p>形の判定はこのページ独自のもので、証券会社アプリの件数とは一致しません。</p>
  </footer>
</main>

<script>
const DATA = __DATA__;
const ORDER = ["もみ合い?", "リバウンド?", "下落?", "下げとまった?"];
// タイルの矢印（線と矢じり）。証券会社アプリのアイコンに合わせた形
const ICONS = {
  "もみ合い?": ["M2 14 L8 9 L14 15 L20 9 L26 14 L36 12", "M31 8 L36 12 L31 16"],
  "リバウンド?": ["M3 5 L15 17 L33 5", "M26 5 L33 5 L30 11"],
  "下落?": ["M2 4 L10 11 L14 8 L22 15 L26 12 L34 20", "M33 14 L34 20 L28 19"],
  "下げとまった?": ["M4 3 L18 17 L36 17", "M31 13 L36 17 L31 21"],
};
const STEP = 30;
const state = { market: "jp", shape: ORDER[0], shown: STEP };

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pct = (v) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(1) + "%";

function spark(values) {
  const W = 160, H = 64, P = 6;
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const x = (i) => (i / (values.length - 1)) * W;
  const y = (v) => P + ((max - v) / span) * (H - 2 * P);
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const last = values.length - 1;
  // 期間の初日を100とした値なので、100 の高さが1ヶ月前の株価
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近1ヶ月の値動き">
    <line class="base" x1="0" x2="${W}" y1="${y(100).toFixed(1)}" y2="${y(100).toFixed(1)}"></line>
    <polygon class="area" points="0,${H} ${pts} ${W},${H}"></polygon>
    <polyline class="line" points="${pts}"></polyline>
    <circle class="dot" cx="${x(last).toFixed(1)}" cy="${y(values[last]).toFixed(1)}" r="2.8"></circle>
  </svg>`;
}

function render() {
  const market = DATA[state.market];
  const group = market.shapes[state.shape];
  const list = group.stocks.slice(0, state.shown);

  document.querySelectorAll("[data-market]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.market === state.market)));
  document.getElementById("asof").textContent = `直近1ヶ月の値動き（${market.asOf} 終値まで）`;
  document.getElementById("shapes").innerHTML = ORDER.map((name) => `
    <button type="button" class="shape" data-shape="${esc(name)}" aria-pressed="${name === state.shape}">
      <span class="name">${esc(name)}</span>
      <span class="meta">
        <svg viewBox="0 0 40 24" aria-hidden="true"><path d="${ICONS[name][0]}"></path><path d="${ICONS[name][1]}"></path></svg>
        <span class="count">${market.shapes[name].count.toLocaleString()}銘柄</span>
      </span>
    </button>`).join("");
  document.getElementById("listhead").innerHTML =
    `<strong>${esc(state.shape)}</strong>${group.count.toLocaleString()}銘柄のうち、時価総額の大きい順に${list.length}銘柄`;
  document.getElementById("grid").innerHTML = list.map((s) => `
    <article class="card">
      <div class="top"><span class="name" title="${esc(s.name)}">${esc(s.name)}</span><span class="chg">${pct(s.change)}</span></div>
      <span class="code">${esc(s.code)}</span>
      ${spark(s.spark)}
    </article>`).join("");
  document.getElementById("more").hidden = state.shown >= group.stocks.length;
}

document.querySelector(".market").addEventListener("click", (e) => {
  const b = e.target.closest("[data-market]");
  if (!b) return;
  state.market = b.dataset.market;
  state.shown = STEP;
  render();
});
document.getElementById("shapes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-shape]");
  if (!b) return;
  state.shape = b.dataset.shape;
  state.shown = STEP;
  render();
});
document.getElementById("more").addEventListener("click", () => {
  state.shown += STEP;
  render();
});
render();
</script>
</body>
</html>
