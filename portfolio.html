:root {
  --bg: #f3f5f9; --surface: #ffffff; --line: #d8deea; --fg: #15213a; --muted: #5b6880;
  --accent: #2160d0; --on-accent: #ffffff; --up: #d93f45; --down: #2a6fdb;

  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1324; --surface: #131c31; --line: #26324c; --fg: #e6ebf5; --muted: #8f9bb2;
    --accent: #6b9fff; --on-accent: #0c1324; --up: #f0656a; --down: #5b9bff;
    --s1: #6b9fff; --s2: #7d879c; --s3: #f08a5d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1324; --surface: #131c31; --line: #26324c; --fg: #e6ebf5; --muted: #8f9bb2;
  --accent: #6b9fff; --on-accent: #0c1324; --up: #f0656a; --down: #5b9bff;
  --s1: #6b9fff; --s2: #7d879c; --s3: #f08a5d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 8px; }
a { color: var(--accent); }
.sub { color: var(--muted); margin: 0; font-size: 13px; }
.market { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.market button { border: 1px solid var(--line) !important; border-radius: 8px; }
.market button { border: 0; background: var(--surface); color: var(--fg); padding: 8px 14px; font: inherit; cursor: pointer; }
.market button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 11em; }
th { color: var(--muted); font-weight: 400; font-size: 12px; }
.num { font-family: var(--font-num); }
.pos { color: var(--up); } .neg { color: var(--down); }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
svg { width: 100%; height: auto; display: block; }
.axis { fill: var(--muted); font-size: 11px; font-family: var(--font-num); }
.grid { stroke: var(--line); }
.inputs { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.inputs label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.inputs input { font: inherit; font-family: var(--font-num); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 150px; }
.note { color: var(--muted); font-size: 13px; }
.note li { margin-bottom: 4px; }
.scroll { overflow-x: auto; }
.nav { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin: 8px 0 0; }
.nav a { text-decoration: none; }
.nav a[aria-current="page"] { color: var(--fg); font-weight: 600; }
.mkt { color: var(--muted); font-size: 11px; margin-left: 4px; }
</style>

const LABEL = {jp: "日本株", us: "米国株"};
const COLORS = ["var(--s1)", "var(--s2)", "var(--s3)"];
const pct = (v, sign = true) => (sign && v > 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
const yen = v => Math.round(v).toLocaleString("ja-JP");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let view = DATA.mixes[0].key;  // 先頭の組み方（screener/portfolio.py の MIXES）を最初に出す

function chart(block) {
  const W = 900, H = 300, L = 46, R = 10, T = 10, B = 26;
  const n = block.months.length;
  const all = block.rows.flatMap(r => r.curve.map(v => v * 10000));
  const lo = Math.log(Math.min(...all, 10000) * 0.95), hi = Math.log(Math.max(...all) * 1.05);
  const x = i => L + (W - L - R) * i / Math.max(1, n - 1);
  const y = v => T + (H - T - B) * (1 - (Math.log(v) - lo) / (hi - lo));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="成績のグラフ">`;
  const ticks = [5000, 7500, 10000, 15000, 20000, 30000, 50000, 75000, 100000, 150000, 200000].filter(v => Math.log(v) > lo && Math.log(v) < hi);
  for (const v of ticks) svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${(v / 10000).toFixed(v % 10000 ? 1 : 0)}万</text>`;
  block.months.forEach((m, i) => { if (m.endsWith("-01")) svg += `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="middle">${m.slice(0, 4)}</text>`; });
  block.rows.forEach((r, k) => {
    const d = r.curve.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v * 10000).toFixed(1)}`).join("");
    svg += `<path d="${d}" fill="none" stroke="${COLORS[k]}" stroke-width="${k ? 1.5 : 2.5}"/>`;
  });
  return svg + "</svg>";
}

function render() {
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  const mix = DATA.mixes.find(m => m.key === view);
  const block = mix || DATA.markets[view];
  document.getElementById("sub").textContent = `${DATA.built} 時点・${block.months[0]} 〜 ${block.months.at(-1)} で試した成績`;
  document.getElementById("chart").innerHTML = chart(block);
  document.getElementById("stats").innerHTML = `<tr><th>組み方</th><th>年率</th><th>最大の下げ</th><th>増え方÷値動き</th><th>1万円→</th></tr>` +
    block.rows.map((r, k) => `<tr><td><span class="key" style="background:${COLORS[k]}"></span>${esc(r.name)}</td>
      <td class="num ${r.cagr >= 0 ? "pos" : "neg"}">${pct(r.cagr)}</td><td class="num neg">${pct(r.maxdd, false)}</td>
      <td class="num">${r.sharpe.toFixed(2)}</td><td class="num">${yen(10000 * (1 + r.total))}円</td></tr>`).join("");
  const markets = mix ? ["jp", "us"] : [view];
  const base = block.rows[1].name.replace(/（.*/, "");
  document.getElementById("halves").innerHTML = `<tr><th>期間</th><th>年率</th><th>${esc(base)}の年率</th><th>最大の下げ</th><th>${esc(base)}の最大の下げ</th></tr>` +
    block.halves.map(h => `<tr><td>${h.label}（${h.from}〜${h.to}）</td>
      <td class="num ${h.cagr >= 0 ? "pos" : "neg"}">${pct(h.cagr)}${h.cagr > h.index_cagr ? " ○" : ""}</td>
      <td class="num">${pct(h.index_cagr)}</td><td class="num neg">${pct(h.maxdd, false)}</td><td class="num">${pct(h.index_maxdd, false)}</td></tr>`).join("");
  document.getElementById("how").textContent = markets.map(m => `${LABEL[m]}: ${DATA.markets[m].universe.toLocaleString()} 銘柄から選びました。`).join(" ");
  // 市場ごとの割合（share）と、その中で指数に置く割合（core）
  holdings(mix ? [["jp", mix.jp, mix.core], ["us", 1 - mix.jp, mix.core]] : [[view, 1, DATA.core]]);
}

function holdings(parts) {
  const amount = Number(document.getElementById("amount").value) || 0;
  const fx = Number(document.getElementById("fx").value) || 150;
  document.getElementById("now").textContent = `次の月末まで持ち、月末に組み直します（上昇率TOP${DATA.top}は入れ替わります）。`;
  let rows = `<tr><th>銘柄</th><th>上昇率</th><th>割合</th><th>金額（円）</th><th>株価</th><th>株数のめやす</th></tr>`;
  for (const [m, share, core] of parts) {
    const d = DATA.markets[m];
    const list = [...(core > 0 ? [{...d.index, weight: core}] : []), ...d.top.map(h => ({...h, weight: (1 - core) / d.top.length}))];
    for (const h of list) {
      const money = amount * share * h.weight;
      const priceYen = m === "us" ? h.price * fx : h.price;
      const shares = money / priceYen;
      const shown = `${Math.floor(shares)}株`;
      const link = m === "jp" ? `https://kabutan.jp/stock/chart?code=${h.code}` : `https://us.kabutan.jp/stocks/${h.code}/chart`;
      const name = h.code === "N225" || h.code === "NDX" ? `${esc(h.name)}（連動する投資信託・ETFで）` : `<a href="${link}" target="_blank" rel="noopener">${esc(h.code)}</a> ${esc(h.name)}`;
      rows += `<tr><td>${name}<span class="mkt">${LABEL[m]}</span></td><td class="num">${h.rise === undefined ? "—" : (h.rise > 0 ? "+" : "") + Math.round(h.rise * 100) + "%"}</td><td class="num">${pct(h.weight * share, false)}</td>
        <td class="num">${yen(money)}</td><td class="num">${m === "us" ? "$" : ""}${h.price.toLocaleString()}</td>
        <td class="num">${h.code === "N225" || h.code === "NDX" ? "—" : shown}</td></tr>`;
    }
  }
  document.getElementById("hold").innerHTML = rows;
}

document.getElementById("views").innerHTML = [...DATA.mixes.map(m => [m.key, m.label]), ["jp", "日本株"], ["us", "米国株"]]
  .map(([key, label]) => `<button type="button" role="tab" data-view="${key}">${esc(label)}</button>`).join("");
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { view = b.dataset.view; render(); }));
document.getElementById("amount").addEventListener("input", render);
document.getElementById("fx").addEventListener("input", render);
render();
</script>
