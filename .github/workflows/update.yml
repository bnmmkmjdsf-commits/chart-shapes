name: チャート一覧を更新

on:
  schedule:
    # それぞれの市場が閉じた後に、その市場だけ取り直す（下の MARKETS で cron の文字列と見比べている）
    - cron: "0 22 * * 1-5"   # 日本時間 火〜土 7:00（米国市場の月〜金の終値のあと）→ 米国株
    - cron: "30 7 * * 1-5"   # 日本時間 月〜金 16:30（東証の終値のあと）→ 日本株
    # 取引時間中は、1時間足だけを1時間おきに取り直す（一覧の銘柄と watch.json の銘柄。下の HOURLY で cron の文字列と見比べている）。
    # 株価が15〜20分遅れて届くので、1時間足が終わってから少し待つ
    - cron: "25 1-6 * * 1-5"    # 日本時間 月〜金 10:25〜15:25 → 日本株の1時間足
    - cron: "50 14-20 * * 1-5"  # 米国東部 月〜金 9:50〜15:50（夏時間は10:50〜16:50）→ 米国株の1時間足
  workflow_dispatch:          # Actions の画面から手動でも動かせる（main 以外のブランチでは公開せず、試し用に作るだけ）
    inputs:
      reuse_data:
        description: 株価を取り直さず、公開中のページのデータで作り直す（見た目だけ変えたとき用。1分ほどで終わる）
        type: boolean
        default: false
      hourly:
        description: 1時間足だけを取り直す（取引時間中の更新と同じ動き。一覧の銘柄と watch.json の銘柄だけ。1〜2分で終わる）
        type: boolean
        default: false
      markets:
        description: 株価を取り直す市場（片方だけのとき、もう片方は公開中のページのデータを使う）
        type: choice
        options: [both, jp, us]
        default: both

permissions:
  contents: write             # 作ったページを gh-pages ブランチに置くため

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 日本株の更新では、株探の決算速報も読む（数百ページを1秒おき）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # 公開中のページを site に取ってくる。銘柄ごとのチャートのファイル（site/s/市場/）は、取り直さない方の市場のぶんを
      # そのまま引き継ぐ（株価を取り直した市場のぶんだけ、ページを作る処理が入れ替える）。初めてのときは空で始める
      - name: 公開中のページを取ってくる
        run: |
          git clone -q --depth 1 -b gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" site || mkdir -p site
          rm -rf site/.git
      # 定期実行では inputs.reuse_data は空なので、いつも株価を取り直す
      - if: ${{ !inputs.reuse_data }}
        run: pip install -r requirements.txt
      - if: ${{ !inputs.reuse_data }}
        env:
          MARKETS: ${{ (github.event.schedule == '0 22 * * 1-5' || github.event.schedule == '50 14-20 * * 1-5') && 'us' || (github.event.schedule == '30 7 * * 1-5' || github.event.schedule == '25 1-6 * * 1-5') && 'jp' || inputs.markets || 'both' }}
          HOURLY: ${{ (github.event.schedule == '25 1-6 * * 1-5' || github.event.schedule == '50 14-20 * * 1-5' || inputs.hourly) && '--hourly' || '' }}
        run: python -u -m screener.gallery --out site/index.html --markets "$MARKETS" $HOURLY   # -u: 進み具合をその場でログに出す
      - if: ${{ inputs.reuse_data }}
        run: python -m screener.retemplate --out site/index.html
      # gh-pages ブランチは毎回1コミットで作り直す（古いページの履歴はためない）。
      # この push がリポジトリの動きになるので、動きの無い公開リポジトリで定期実行が60日で止まる仕組みにも掛からない
      # main 以外では公開せず、作ったページを Actions の成果物として残す（gh run download で取れる）
      - name: 試し用のページを残す
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: page
          path: site/index.html
      - name: gh-pages に公開
        if: github.ref == 'refs/heads/main'
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "チャート一覧を更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
